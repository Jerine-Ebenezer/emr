<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Login - EMR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>

    body {
      background: linear-gradient(135deg, #6c63ff, #00bfa6);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
    }
    .login-card {
      border-radius: 15px;
      padding: 2.5rem;
      width: 450px;
      max-width: 90%;
      background: #ffffffcc;
      backdrop-filter: blur(10px);
    }
    h3 {
      color: #333;
      font-weight: 600;
    }
    .btn-login {
      background-color: #007bff;
      color: white;
    }
    .btn-login:hover {
      background-color: #0056b3;
    }
    .btn-register {
      background-color: #28a745;
      color: white;
    }
    .btn-register:hover {
      background-color: #1e7e34;
    }
  </style>

</head>

<body class="d-flex justify-content-center align-items-center">

  <div class="login-card text-center shadow-lg">

    <!-- Title -->
    <h3 class="mb-2">Doctor Portal Login</h3>
    <p class="text-muted small mb-4">
      Login using your <b>Username and Password</b>
    </p>

    <!-- Login Form -->
    <form id="loginForm" autocomplete="off">
      <div class="mb-3 text-start">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
      </div>
      <div class="mb-3 text-start">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-login">Login</button>
        <a href="register.html" class="btn btn-register">Register as Doctor</a>
      </div>
    </form>
  </div>

  <script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();

  if (!username || !password) {
    alert("Please enter both username and password");
    return;
  }

  // Send login request to backend
  try {
    const response = await fetch('http://localhost:8080/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    });

    const data = await response.text(); // backend returns plain string
    alert(data);

    if (response.ok && data.includes("successful")) {
      window.location.href = "dashboard.html"; // redirect to dashboard
    }

  } catch (error) {
    console.error(error);
    alert("Something went wrong!");
  }
});
</script>

</body>
</html>
