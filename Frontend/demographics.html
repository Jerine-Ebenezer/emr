<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patient Registration</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    .form-label {
  font-weight: 500;   /* Normal weight (not bold) */
  color: #333;        /* Softer dark gray */
}

/* Input fields - stylish white cards */
.form-control, 
.form-select, 
textarea {
  background-color: #fff !important;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  transition: all 0.2s ease-in-out;
}

/* Focus effect */
.form-control:focus, 
.form-select:focus, 
textarea:focus {
  border-color: #007bff;
  box-shadow: 0 0 6px rgba(0,123,255,0.4);
}

/* Buttons more rounded for consistency */
.btn {
  border-radius: 8px;
}
    body {
       background: linear-gradient(90deg, #007bff, #00c6ff);
    }
   
    .card {
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
    }
    h2 {
      font-weight: 700;
      color: #007bff;
    }
    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.9rem;
      color: #888;
    }
  </style>
</head>
<body>
   <div class="mb-3">
  <a href="dashboard.html" class="btn btn-primary">&larr; Back to Dashboard</a>
</div>
  <div class="container mt-5">
    <div class="card p-4">
      <h2 class="mb-4"> Add Patient Demographics</h2>
      <form id="demographicsForm">
        <!-- Basic Identifiers -->
        <div class="row mb-3">
          <div class="col-md-3">
            <label class="form-label">Patient ID</label>
            <input
              type="text"
              id="patientId"
              class="form-control"
              placeholder="Auto-generated"
              readonly
              required
            />
          </div>
          <div class="col-md-4">
            <label class="form-label">First Name</label>
            <input type="text" id="firstName" class="form-control" required />
          </div>
          <div class="col-md-5">
            <label class="form-label">Last Name</label>
            <input type="text" id="lastName" class="form-control" required />
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-3">
            <label class="form-label">Date of Birth</label>
            <input type="date" id="dob" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label class="form-label">Age</label>
            <input type="number" id="age" class="form-control" readonly required />
          </div>
          <div class="col-md-3">
            <label class="form-label">Gender</label>
            <select id="gender" class="form-select" required>
              <option value="">Select Gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Blood Group</label>
            <select id="bloodGroup" class="form-select" required>
              <option value="">Select Blood Group</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>AB+</option><option>AB-</option>
              <option>O+</option><option>O-</option>
            </select>
          </div>
        </div>

        <!-- Contact Info -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="phone" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Address</label>
          <textarea id="address" class="form-control" rows="2" required></textarea>
        </div>

        <!-- Personal Info -->
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Marital Status</label>
            <select id="maritalStatus" class="form-select" required>
              <option value="">Select</option>
              <option>Single</option>
              <option>Married</option>
              <option>Divorced</option>
              <option>Widowed</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Occupation</label>
            <input type="text" id="occupation" class="form-control" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Nationality</label>
            <input type="text" id="nationality" class="form-control" required />
          </div>
        </div>

        <!-- Emergency Contact -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Emergency Contact Name</label>
            <input type="text" id="emergencyName" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label class="form-label">Relation</label>
            <input type="text" id="emergencyRelation" class="form-control" required />
          </div>
          <div class="col-md-3">
            <label class="form-label">Phone</label>
            <input type="tel" id="emergencyPhone" class="form-control" required />
          </div>
        </div>

        <!-- Insurance / ID -->
        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">ABHA ID</label>
            <input type="text" id="abhaId" class="form-control" placeholder="Enter ABHA ID" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Insurance Provider</label>
            <input type="text" id="insurance" class="form-control"  placeholder="" required />
          </div>
          <div class="col-md-4">
            <label class="form-label">Policy / Government ID</label>
            <input type="text" id="policyId" class="form-control"  placeholder="" required />
          </div>
        </div>

        <!-- Buttons -->
        <div class="d-flex justify-content-between">
          <button type="reset" class="btn btn-outline-secondary">Clear</button>
          <button type="submit" class="btn btn-primary " id ="submitBtn">Save Patient</button>
        </div>
      </form>
    </div>

    <footer>
      <p class="text-center mt-4 mb-4 text-muted">EMR System © 2025</p>
    </footer>
  </div>

  <script>
    const BASE_URL ="http://localhost:8080";
    const form = document.getElementById("demographicsForm");
    const submitbtn = document.getElementById("submitBtn");
    let patients = []; // <-- add this at the top

    let editId = null;

    form.addEventListener("submit",async e =>{
      e.preventDefault();

      const patientId = document.getElementById("patientId").value
      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const dob= document.getElementById("dob").value;
      const gender = document.getElementById("gender").value
      const phoneNumber = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const address = document.getElementById("address").value.trim();
      const abhaId = document.getElementById("abhaId").value.trim();

      if(!patientId || !firstName || !lastName || !dob || !gender || !phoneNumber || !email || !abhaId || !address){
        alert("All fields are required")
        return;
      }

      const patient = {patientId,firstName,lastName,dob,gender,phoneNumber,email,abhaId,address};
      try{
        const url = editId !== null? `${BASE_URL}/add/patients/${editId}`:
        `${BASE_URL}/add/patients`;
        const method = editId !== null?"PUT":"POST";

        const res = await fetch(url, {
          method,
          headers:{"Content-Type": "application/json"},
          body : JSON.stringify(patient)
        });
        if(!res.ok){
          const errorData = await res.json().catch(() => null);
        throw new Error(errorData?.message || "Failed to add/update patient");
       
        }
         editId = null;
         
      }catch(err){
        console.error(err);
         alert(err.message || "Error adding/updating adding. Check console.");
  
      }

    });


    // Utility: Generate Patient ID with prefix "P" and zero-padded 3 digits
    function generatePatientId(num) {
      return "P" + num.toString().padStart(3, "0");
    }

    // Initialize Patient ID input with next ID
    function updatePatientIdField() {
      const nextId = generatePatientId(patients.length + 1);
      document.getElementById("patientId").value = nextId;
    }

    // Calculate age from DOB on change
    document.getElementById("dob").addEventListener("change", function () {
      const dob = new Date(this.value);
      const ageDiff = Date.now() - dob.getTime();
      const ageDate = new Date(ageDiff);
      document.getElementById("age").value = Math.abs(ageDate.getUTCFullYear() - 1970);
    });

    // Update Patient ID field on page load
    updatePatientIdField();

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const patient = {
        patientId: document.getElementById("patientId").value,
        firstName: document.getElementById("firstName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        dob: document.getElementById("dob").value,
        age: document.getElementById("age").value,
        gender: document.getElementById("gender").value,
        bloodGroup: document.getElementById("bloodGroup").value,
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim(),
        address: document.getElementById("address").value.trim(),
        maritalStatus: document.getElementById("maritalStatus").value,
        occupation: document.getElementById("occupation").value.trim(),
        nationality: document.getElementById("nationality").value.trim(),
        emergencyName: document.getElementById("emergencyName").value.trim(),
        emergencyRelation: document.getElementById("emergencyRelation").value.trim(),
        emergencyPhone: document.getElementById("emergencyPhone").value.trim(),
        abhaId: document.getElementById("abhaId").value.trim(), // ✅ New ABHA ID field
        insurance: document.getElementById("insurance").value.trim(),
        policyId: document.getElementById("policyId").value.trim()
      };

      // Add patient
      patients.push(patient);

      // Reset form and update Patient ID for next entry
      form.reset();
      updatePatientIdField();

     
    });
  </script>
</body>
</html>
