<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Clinical Report</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>

  .form-label { font-weight: 500; color: #333; }
  .form-control, .form-select, textarea {
    background-color: #fff !important;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    font-size: 0.95rem;
    transition: all 0.2s ease-in-out;
  }
  .form-control:focus, .form-select:focus, textarea:focus {
    border-color: #007bff;
    box-shadow: 0 0 6px rgba(0,123,255,0.3);
    outline: none;
  }
  ::placeholder { color: #aaa; font-style: italic; font-size: 0.9rem; }
  .btn { border-radius: 8px; padding: 8px 16px; }
  body { background: linear-gradient(90deg, #007bff, #00c6ff); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  .card { border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
  h2 { font-weight: 700; color: #007bff; }
  .autocomplete-suggestions { border: 1px solid #ddd; max-height: 150px; overflow-y: auto; position: absolute; background: #fff; z-index: 1000; width: 100%; border-radius: 5px; }
  .autocomplete-suggestion { padding: 8px 12px; cursor: pointer; }
  .autocomplete-suggestion:hover { background-color: #f0f0f0; }
  .position-relative { position: relative; }
  .section-card { border-radius: 10px; background: #fff; padding: 15px; margin-top: 20px; }

</style>
</head>

<body>

<div class="mb-3">
  <a href="dashboard.html" class="btn btn-primary">&larr; Back to Dashboard</a>
</div>

<div class="container mt-5">
  <div class="card p-4">
    <h2 class="mb-4">Clinical Report</h2>
    <form id="clinicalForm">
      <!-- Patient Autocomplete -->
      <div class="mb-3 position-relative">
        <label class="form-label">Select Patient (P001 or Name)</label>
        <input type="text" id="patientInput" class="form-control" placeholder="Type patient name or ID" autocomplete="off" required />
        <div id="patientSuggestions" class="autocomplete-suggestions"></div>
      </div>

      <div class="mb-3">
        <label class="form-label">Visit Date</label>
        <input type="date" id="visitDate" class="form-control" required />
      </div>

      <div class="row mb-3 position-relative">
        <div class="col-md-6">
          <label class="form-label">Diagnosis</label>
          <input type="text" id="diagnosis" class="form-control" placeholder="Enter diagnosis" required autocomplete="off" />
          <div id="diagnosisSuggestions" class="autocomplete-suggestions"></div>
        </div>
        <div class="col-md-3">
          <label class="form-label">ICD-11 Code</label>
          <input type="text" id="icdCode" class="form-control" placeholder="ICD-11 code" readonly />
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Clinical Notes</label>
        <textarea id="notes" class="form-control" rows="3" placeholder="Observations, exam findings, etc."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Treatment Plan</label>
        <textarea id="treatment" class="form-control" rows="2" placeholder="Medications, lifestyle advice, follow-up instructions"></textarea>
      </div>

      <div class="d-flex justify-content-between">
        <button type="reset" class="btn btn-outline-secondary">Clear</button>
        <button type="submit" class="btn btn-primary">Save Report</button>
      </div>
    </form>
  </div>

  <div id="previousReports"></div>
</div>

<script>
  
const patientInput = document.getElementById("patientInput");
const patientSuggestions = document.getElementById("patientSuggestions");
const diagnosisInput = document.getElementById("diagnosis");
const diagnosisSuggestions = document.getElementById("diagnosisSuggestions");
const icdCodeInput = document.getElementById("icdCode");
const clinicalForm = document.getElementById("clinicalForm");
const visitDateInput = document.getElementById("visitDate");
const previousReportsDiv = document.getElementById("previousReports");

let patients = [];
let selectedPatient = null;

// Prefill visit date
visitDateInput.value = new Date().toISOString().split("T")[0];

// Load patients from backend
async function loadPatients() {
  try {
    //const res = await fetch("http://localhost:8080/api/patients");
    const res = await fetch("https://emr-backend-ni58.onrender.com/api/patients");
    patients = await res.json();
  } catch (err) {
    console.error("Failed to load patients:", err);
  }
}
loadPatients();

// Patient autocomplete
patientInput.addEventListener("input", () => {
  const query = patientInput.value.trim().toLowerCase();
  selectedPatient = null;
  patientSuggestions.innerHTML = "";
  if (!query) return;

  const matches = patients.filter(p =>
    p.patientId.toLowerCase().includes(query) ||
    `${p.firstName} ${p.lastName}`.toLowerCase().includes(query)
  );

  matches.forEach(p => {
    const div = document.createElement("div");
    div.className = "autocomplete-suggestion";
    div.textContent = `${p.firstName} ${p.lastName} (${p.patientId})`;
    div.addEventListener("click", () => {
      patientInput.value = `${p.firstName} ${p.lastName} (${p.patientId})`;
      selectedPatient = p;
      patientSuggestions.innerHTML = "";
      loadPreviousReports(selectedPatient.patientId);
    });
    patientSuggestions.appendChild(div);
  });
});

document.addEventListener("click", e => {
  if (!patientInput.contains(e.target) && !patientSuggestions.contains(e.target)) {
    patientSuggestions.innerHTML = "";
  }
});

// Diagnosis autocomplete
let diagTimeout;
diagnosisInput.addEventListener("input", () => {
  clearTimeout(diagTimeout);
  const query = diagnosisInput.value.trim();
  if (!query) {
    diagnosisSuggestions.innerHTML = "";
    icdCodeInput.value = "";
    return;
  }

  diagTimeout = setTimeout(async () => {
    try {
     // const res = await fetch(`http://localhost:8080/searchByName?name=${encodeURIComponent(query)}`);
      const res = await fetch(`https://emr-backend-ni58.onrender.com/searchByName?name=${encodeURIComponent(query)}`);
      const diseases = await res.json();
      diagnosisSuggestions.innerHTML = "";

      diseases.forEach(d => {
        const div = document.createElement("div");
        div.className = "autocomplete-suggestion";
        div.textContent = d.diseaseName;
        div.addEventListener("click", () => {
          diagnosisInput.value = d.diseaseName;
          icdCodeInput.value = d.diseaseCode;
          diagnosisSuggestions.innerHTML = "";
        });
        diagnosisSuggestions.appendChild(div);
      });
    } catch (err) {
      console.error(err);
    }
  }, 300);
});

document.addEventListener("click", e => {
  if (!diagnosisInput.contains(e.target) && !diagnosisSuggestions.contains(e.target)) {
    diagnosisSuggestions.innerHTML = "";
  }
});

// Submit clinical report
clinicalForm.addEventListener("submit", async e => {
  e.preventDefault();
  if (!selectedPatient) return alert("Please select a patient");

  const report = {
    visitDate: visitDateInput.value,
    diagnosis: diagnosisInput.value,
    icdCode: icdCodeInput.value,
    notes: document.getElementById("notes").value,
    treatment: document.getElementById("treatment").value
  };

  try {
  await fetch(`https://emr-backend-ni58.onrender.com/api/clinical-reports?patientCode=${selectedPatient.patientId}`, {
   // await fetch(`http://localhost:8080/api/clinical-reports?patientCode=${selectedPatient.patientId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(report)
    });
    alert("Clinical report saved successfully!");
    clinicalForm.reset();
    visitDateInput.value = new Date().toISOString().split("T")[0];
    icdCodeInput.value = "";
    loadPreviousReports(selectedPatient.patientId);
  } catch (err) {
    console.error(err);
    alert("Failed to save report");
  }
});


    // Load previous clinical reports
async function loadPreviousReports(patientCode) {
  previousReportsDiv.innerHTML = "";

  try {
    const res = await fetch(
      `https://emr-backend-ni58.onrender.com/api/clinical-reports?patientCode=${encodeURIComponent(patientCode)}`
    );

    const reports = await res.json();

    if (reports.length === 0) return;

    reports.forEach(r => {
      const div = document.createElement("div");
      div.className = "section-card";

      div.innerHTML = `
        <h5>Visit Date: ${r.visitDate}</h5>
        <p><b>Diagnosis:</b> ${r.diagnosis} (${r.icdCode})</p>
        <p><b>Notes:</b> ${r.notes || '-'}</p>
        <p><b>Treatment:</b> ${r.treatment || '-'}</p>
      `;

      previousReportsDiv.appendChild(div);
    });

  } catch (err) {
    console.error("Failed to load previous reports:", err);
  }
}
</script>

</body>
</html>
