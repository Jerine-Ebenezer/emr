<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Medical History</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>

    .form-label { font-weight: 500; color: #333; }
    .form-control, textarea {
      background-color: #fff !important;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      font-size: 0.95rem;
    }
    .form-control:focus, textarea:focus {
      border-color: #007bff;
      box-shadow: 0 0 6px rgba(0,123,255,0.3);
    }
    ::placeholder { color: #aaa; font-style: italic; font-size: 0.9rem; }
    .btn { border-radius: 8px; padding: 8px 16px; }
    body { background: linear-gradient(90deg, #007bff, #00c6ff); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); }
    h2 { font-weight: 700; color: #007bff; }
    #patientSuggestions {
      position: absolute;
      z-index: 1000;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }
    #patientSuggestions .list-group-item { cursor: pointer; }
    .small-muted { font-size: .85rem; color: #033; }
  </style>

</head>
<body>

<div class="mb-3 p-3">
  <a href="dashboard.html" class="btn btn-primary">&larr; Back to Dashboard</a>
</div>

<div class="container mt-2">
  <div class="card p-4 mx-auto" style="max-width:900px;">
    <h2 class="mb-4">Medical History</h2>

    <div id="alertArea"></div>

    <form id="historyForm">
      <!-- Patient autocomplete -->
      <div class="mb-3 position-relative">
        <label class="form-label">Select Patient</label>
        <input type="text" id="patientInput" class="form-control" placeholder="Type patient name or ID (e.g. P001)">
        <div id="patientSuggestions" class="list-group mt-1" style="display:none"></div>

        <div class="mt-2 d-flex gap-2">
          <button type="button" id="clearSelectionBtn" class="btn btn-outline-secondary">Clear selection</button>
          <button type="button" id="loadHistoryBtn" class="btn btn-outline-info" disabled>Load History (by code)</button>
          <div id="selectedPatientText" class="flex-grow-1 small-muted text-end"></div>
        </div>
      </div>

      <!-- Hidden store for selected IDs -->
      <input type="hidden" id="selectedPatientDbId" />
      <input type="hidden" id="selectedPatientCode" />

      <!-- Past Illnesses -->
      <div class="mb-3">
        <label class="form-label">Past Illnesses / Chronic Conditions</label>
        <textarea id="pastIllnesses" class="form-control" rows="2" placeholder="Diabetes, Hypertension, Asthma, etc."></textarea>
      </div>

      <!-- Surgeries -->
      <div class="mb-3">
        <label class="form-label">Past Surgeries / Hospitalizations</label>
        <textarea id="surgeries" class="form-control" rows="2" placeholder="Appendectomy, Knee surgery, etc."></textarea>
      </div>

      <!-- Allergies -->
      <div class="mb-3">
        <label class="form-label">Allergies</label>
        <textarea id="allergies" class="form-control" rows="2" placeholder="Drug, food, environmental allergies"></textarea>
      </div>

      <!-- Family History -->
      <div class="mb-3">
        <label class="form-label">Family History</label>
        <textarea id="familyHistory" class="form-control" rows="2" placeholder="Diabetes in father, Hypertension in mother, etc."></textarea>
      </div>

      <!-- Social History -->
      <div class="mb-3">
        <label class="form-label">Social History</label>
        <textarea id="socialHistory" class="form-control" rows="2" placeholder="Smoking, alcohol, occupation, lifestyle habits"></textarea>
      </div>

      <!-- Immunization History -->
      <div class="mb-3">
        <label class="form-label">Immunization History</label>
        <textarea id="immunizations" class="form-control" rows="2" placeholder="MMR, Hepatitis B, COVID-19, Flu, etc."></textarea>
      </div>

      <div class="d-flex justify-content-between">
        <button type="reset" class="btn btn-outline-secondary" id="resetBtn">Clear</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save History</button>
      </div>
    </form>
  </div>
</div>

<script>

//const API_BASE = "http://localhost:8080";
const API_BASE = "https://emr-backend-ni58.onrender.com";
const PATIENTS_API = `${API_BASE}/api/patients`;

const SAVE_HISTORY_API = `${API_BASE}/api/medical-history`;
const LOAD_HISTORY_BY_CODE = code => `${API_BASE}/show/medHistory/${encodeURIComponent(code)}`;

const historyForm = document.getElementById("historyForm");
const patientInput = document.getElementById("patientInput");
const patientSuggestions = document.getElementById("patientSuggestions");
const alertArea = document.getElementById("alertArea");
const clearSelectionBtn = document.getElementById("clearSelectionBtn");
const loadHistoryBtn = document.getElementById("loadHistoryBtn");
const selectedPatientText = document.getElementById("selectedPatientText");

const selectedPatientDbId = document.getElementById("selectedPatientDbId"); // numeric id (1)
const selectedPatientCode = document.getElementById("selectedPatientCode"); // external code (P001)

let patients = [];       // full list from backend
let selectedPatient = null; // object { id, patientId, firstName, lastName, ... }

function showAlert(type, msg, dismissAfter=4000) {
  alertArea.innerHTML = `
    <div class="alert alert-${type} alert-dismissible fade show" role="alert">
      ${msg}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>`;
  if (dismissAfter) setTimeout(()=> alertArea.innerHTML="", dismissAfter);
}

// load patients once at startup
async function loadPatients() {
  try {
   // const res = await fetch(`http://localhost:8080/api/patients`);
    const res = await fetch(`${API_BASE}/api/patients`);
    if (!res.ok) throw new Error("status " + res.status);
    patients = await res.json();
  } catch (err) {
    console.error("Failed to load patients", err);
    showAlert("danger", "Failed to load patients from backend. Check server and CORS.");
    patients = [];
  }
}
loadPatients();

// render suggestion list
function renderSuggestions(list) {
  patientSuggestions.innerHTML = "";
  if (!list.length) { patientSuggestions.style.display = "none"; return; }
  list.forEach(p => {
    const el = document.createElement("div");
    el.className = "list-group-item list-group-item-action";
    el.textContent = `${p.firstName || ""} ${p.lastName || ""} (${p.patientId || "—"})`.trim();
    el.addEventListener("click", () => {
      selectPatient(p);
    });
    patientSuggestions.appendChild(el);
  });
  patientSuggestions.style.display = "block";
}

// on input - autocomplete by name or patientId (P001)
let debounce;
patientInput.addEventListener("input", () => {
  clearTimeout(debounce);
  const q = patientInput.value.trim().toLowerCase();
  // reset selection until user picks
  selectedPatient = null;
  selectedPatientDbId.value = "";
  selectedPatientCode.value = "";
  selectedPatientText.textContent = "";
  loadHistoryBtn.disabled = true;

  if (!q) {
    patientSuggestions.innerHTML = "";
    patientSuggestions.style.display = "none";
    return;
  }
  debounce = setTimeout(() => {
    const filtered = patients.filter(p => {
      const name = `${p.firstName || ""} ${p.lastName || ""}`.toLowerCase();
      const pid = (p.patientId || "").toLowerCase();
      return name.includes(q) || pid.includes(q);
    }).slice(0, 30);
    renderSuggestions(filtered);
  }, 150);
});

// when user clicks a suggestion
function selectPatient(p) {
  selectedPatient = p;
  // show doctor-facing text with patient code (P001)
  patientInput.value = `${p.firstName || ""} ${p.lastName || ""} (${p.patientId})`.trim();
  selectedPatientDbId.value = p.id;        // internal DB id (1)
  selectedPatientCode.value = p.patientId; // external code (P001)
  selectedPatientText.textContent = `Selected: ${p.firstName || ""} ${p.lastName || ""} — ${p.patientId}`;
  patientSuggestions.innerHTML = "";
  patientSuggestions.style.display = "none";
  loadHistoryBtn.disabled = false;
}

// clear selection explicitly
clearSelectionBtn.addEventListener("click", () => {
  selectedPatient = null;
  patientInput.value = "";
  selectedPatientDbId.value = "";
  selectedPatientCode.value = "";
  selectedPatientText.textContent = "";
  patientSuggestions.innerHTML = "";
  patientSuggestions.style.display = "none";
  loadHistoryBtn.disabled = true;
});

// clicking outside hides suggestions
document.addEventListener("click", e => {
  if (!patientInput.contains(e.target) && !patientSuggestions.contains(e.target)) {
    patientSuggestions.innerHTML = "";
    patientSuggestions.style.display = "none";
  }
});

// Load history by patient external code (P001) — calls your backend endpoint exactly
loadHistoryBtn.addEventListener("click", async () => {
  const code = selectedPatientCode.value || patientInput.value.trim();
  if (!code) return showAlert("warning", "Select a patient (by picking from suggestions) before loading history.");
  try {
    //const res = await fetch(`http://localhost:8080/show/medHistory/{code}`);
    const res = await fetch(LOAD_HISTORY_BY_CODE(code));
    if (res.status === 404) {
      showAlert("info", "No medical history found for " + code);
      // clear form while keeping selection
      document.getElementById("pastIllnesses").value = "";
      document.getElementById("surgeries").value = "";
      document.getElementById("allergies").value = "";
      document.getElementById("familyHistory").value = "";
      document.getElementById("socialHistory").value = "";
      document.getElementById("immunizations").value = "";
      return;
    }
    if (!res.ok) throw new Error("status " + res.status);
    const data = await res.json();

    // Fill form — backend might return keys slightly different, try common names
    document.getElementById("pastIllnesses").value = data.pastIllnesses ?? data.pastIllness ?? "";
    document.getElementById("surgeries").value = data.surgeries ?? "";
    document.getElementById("allergies").value = data.allergies ?? "";
    document.getElementById("familyHistory").value = data.familyHistory ?? "";
    document.getElementById("socialHistory").value = data.socialHistory ?? "";
    document.getElementById("immunizations").value = data.immunizations ?? data.immunization ?? "";

    // Ensure we keep correct internal db id if returned
    if (data.patientDbId) selectedPatientDbId.value = data.patientDbId;
    if (data.patient && data.patient.id) selectedPatientDbId.value = data.patient.id;

    showAlert("success", "Loaded medical history for " + code);
  } catch (err) {
    console.error(err);
    showAlert("danger", "Failed to load history: " + (err.message || ""));
  }
});

// Submit the form — send patientDbId (internal numeric id)
historyForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  const dbId = selectedPatientDbId.value;
  if (!dbId) {
    showAlert("warning", "Please select a patient from the suggestions (this ensures we have the internal DB id).");
    return;
  }

  const payload = {
    patient: { id: selectedPatientDbId.value}, // P001
    pastIllnesses: document.getElementById("pastIllnesses").value.trim(),
    surgeries: document.getElementById("surgeries").value.trim(),
    allergies: document.getElementById("allergies").value.trim(),
    familyHistory: document.getElementById("familyHistory").value.trim(),
    socialHistory: document.getElementById("socialHistory").value.trim(),
    immunizations: document.getElementById("immunizations").value.trim()
};


  try {
  //const res = await fetch(`http://localhost:8080/api/med-history`, {
  const res = await fetch(`${API_BASE}/api/med-history`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    if (res.ok) {
      showAlert("success", "Medical history saved successfully.");
      // keep the selected patient so user can continue editing; just reset fields
      document.getElementById("pastIllnesses").value = "";
      document.getElementById("surgeries").value = "";
      document.getElementById("allergies").value = "";
      document.getElementById("familyHistory").value = "";
      document.getElementById("socialHistory").value = "";
      document.getElementById("immunizations").value = "";
    } else {
      let txt = await res.text();
      throw new Error(txt || ("status " + res.status));
    }
  } catch (err) {
    console.error(err);
    showAlert("danger", "Error saving history: " + (err.message || ""));
  }
});

// keep selected patient after a HTML reset (Reset button)
document.getElementById("resetBtn").addEventListener("click", () => {
  setTimeout(() => {
    if (selectedPatient) {
      patientInput.value = `${selectedPatient.firstName || ""} ${selectedPatient.lastName || ""} (${selectedPatient.patientId})`.trim();
      selectedPatientDbId.value = selectedPatient.id;
      selectedPatientCode.value = selectedPatient.patientId;
      selectedPatientText.textContent = `Selected: ${selectedPatient.firstName || ""} ${selectedPatient.lastName || ""} — ${selectedPatient.patientId}`;
      loadHistoryBtn.disabled = false;
    } else {
      selectedPatientDbId.value = "";
      selectedPatientCode.value = "";
      selectedPatientText.textContent = "";
      loadHistoryBtn.disabled = true;
    }
  }, 0);
});
</script>

<!-- bootstrap js -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
