<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Disease Prevalence Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0; 
      padding: 2rem;
      background: linear-gradient(90deg, #007bff, #00c6ff);
      display: flex; 
      justify-content: center; 
      align-items: flex-start;
      min-height: 100vh;
    }
    .container {
      max-width: 800px;
      width: 100%;
    }
    .chart-container {
      background: white;
      padding: 2rem 2.5rem;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      margin-top: 1.5rem;
    }
    canvas { width: 100% !important; height: auto !important; }
    .back-btn { position: fixed; top: 10px; left: 10px; z-index: 1000; }
    .heading-section { text-align: center; margin-bottom: 1rem; }
    .heading-section h1 { font-size: 28px; font-weight: 700; color: #bbd2ea; margin-bottom: 0.3rem; }
    .heading-section p { font-size: 16px; color: #bbb; margin: 0; }
  </style>
</head>

<body>
  <a href="dashboard.html" class="btn btn-primary back-btn">&larr; Back to Dashboard</a>

  <div class="container">
    <div class="heading-section">
      <h1>Disease Prevalence Overview</h1>
      <p>Visual representation of diseases diagnosed among your patients</p>
    </div>

    <div class="chart-container">
      <canvas id="diseaseChart"></canvas>
    </div>
  </div>

  <script>
   // const API_BASE = "http://localhost:8080";
    const API_BASE = "https://emr-backend-ni58.onrender.com";
    // Fetch all clinical reports from backend
    async function loadClinicalReports() {
      try {
        const res = await fetch(`${API_BASE}/api/clinical-reports`);
        if (!res.ok) throw new Error("Failed to fetch clinical reports");
        const reports = await res.json();
        return reports;
      } catch(err) {
        console.error(err);
        alert("Could not load clinical reports from server");
        return [];
      }
    }

    // Render chart dynamically
    async function renderDiseaseChart() {
      const clinicalReports = await loadClinicalReports();

      // Count unique patients per disease
      const diseaseCounts = {};
      const seenPatients = {};

      clinicalReports.forEach(report => {
        const disease = report.diagnosis || "Unknown";
        const patientId = report.patient?.patientId || report.patientId;

        if (!seenPatients[disease]) seenPatients[disease] = new Set();
        seenPatients[disease].add(patientId);
      });

      Object.keys(seenPatients).forEach(disease => {
        diseaseCounts[disease] = seenPatients[disease].size;
      });

      const labels = Object.keys(diseaseCounts);
      const data = Object.values(diseaseCounts);

      const ctx = document.getElementById('diseaseChart').getContext('2d');

      new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'Number of Patients',
            data,
            backgroundColor: labels.map(() => 'rgba(54, 162, 235, 0.6)'),
            borderColor: 'rgba(54, 162, 235, 1)',
            borderWidth: 1,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: { beginAtZero: true, title: { display: true, text: 'Number of Patients' } },
            x: { title: { display: true, text: 'Disease' } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    renderDiseaseChart();
  </script>
</body>
</html>
