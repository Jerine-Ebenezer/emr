<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prescription Management - Doctor EMR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>

    .form-label { font-weight: 500; color: #333; }
    .form-control, textarea { background-color: #fff !important; border: 1px solid #ddd; border-radius: 10px; padding: 10px 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: all 0.2s ease-in-out; }
    .form-control:focus, textarea:focus { border-color: #007bff; box-shadow: 0 0 6px rgba(0,123,255,0.4); }
    ::placeholder { color: #999; font-style: italic; }
    .btn { border-radius: 8px; padding: 8px 18px; font-weight: 500; }
    .medicine-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .medicine-row input { flex: 1; border-radius: 8px; }
    .table { border-radius: 10px; overflow: hidden; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .table th { background: #007bff !important; color: #fff !important; font-weight: 600; }
    .table td { background: #fafafa; }
    .table-hover tbody tr:hover { background-color: #f1f8ff; }
    body { background: linear-gradient(90deg, #007bff, #00c6ff); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px 0; }
    .card { border-radius: 15px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); padding: 25px; margin-bottom: 30px; background: #fff; }
    h2 { text-align: center; font-weight: 800; font-size: 2rem; margin-bottom: 25px; color: #c5d0dd; }
    footer { text-align: center; margin-top: 40px; font-size: 0.9rem; color: #888; }
    #patientSuggestions { position: absolute; z-index: 1000; width: 100%; max-height: 200px; overflow-y: auto; }
    #patientSuggestions .list-group-item { cursor: pointer; }
    
  </style>
</head>
<body>
 <div class="mb-3">
  <a href="dashboard.html" class="btn btn-primary">&larr; Back to Dashboard</a>
</div>
<div class="container">
  <h2 style="color: white;">Prescription Management</h2>

  <!-- Prescription Form -->
  <div class="card">
    <h4 class="mb-3">Add New Prescription</h4>
    <form id="prescriptionForm">
      <div class="row g-3">
        <!-- Patient autocomplete -->
        <div class="col-md-6 position-relative">
          <label class="form-label">Select Patient</label>
          <input type="text" id="patientInput" class="form-control" placeholder="Type patient name or ID" required>
          <div id="patientSuggestions" class="list-group mt-1"></div>
        </div>

        <!-- Date -->
        <div class="col-md-6">
          <label class="form-label">Date</label>
          <input type="date" id="date" class="form-control" required>
        </div>
      </div>

      <!-- Medicines -->
      <div class="mt-3" id="medicinesContainer">
        <label class="form-label">Medicines</label>
        <div class="medicine-row">
          <input type="text" class="form-control med-name" placeholder="Medicine Name" required>
          <input type="text" class="form-control med-dose" placeholder="Dosage (500mg)" required>
          <input type="text" class="form-control med-freq" placeholder="Frequency (2/day)" required>
          <input type="text" class="form-control med-duration" placeholder="Duration (5 days)" required>
        </div>
      </div>
      <button type="button" class="btn btn-sm btn-secondary add-medicine" onclick="addMedicine()">➕ Add Medicine</button>

      <!-- Notes -->
      <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea id="notes" class="form-control" rows="2" placeholder="Additional advice..."></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100">💾 Save Prescription</button>
    </form>
  </div>

  <!-- Saved Prescriptions -->
  <div class="card">
    <h4 class="mb-3">Saved Prescriptions</h4>
    <table class="table table-bordered table-hover">
      <thead class="table-primary">
        <tr>
          <th>#</th>
          <th>Patient</th>
          <th>Date</th>
          <th>Download PDF</th>
        </tr>
      </thead>
      <tbody id="prescriptionTable"></tbody>
    </table>
  </div>
</div>

<footer>© 2025 Doctor EMR. All Rights Reserved.</footer>

<script>
//const API_BASE = "http://localhost:8080/api";
const API_BASE = "https://emr-backend-ni58.onrender.com/api";
const prescriptionForm = document.getElementById("prescriptionForm");

const patientInput = document.getElementById("patientInput");
const patientSuggestions = document.getElementById("patientSuggestions");
const prescriptionTable = document.getElementById("prescriptionTable");
const medicinesContainer = document.getElementById("medicinesContainer");

let patients = [];
let selectedPatient = null;

// Load patients from backend
async function loadPatients() {
  try {
    const res = await fetch(`${API_BASE}/patients`);

    patients = await res.json();
  } catch (err) {
    console.error(err);
    alert("Failed to load patients");
  }
}
loadPatients();

// Autocomplete patient input
let timeout;
patientInput.addEventListener("input", () => {
  clearTimeout(timeout);
  const query = patientInput.value.trim().toLowerCase();
  selectedPatient = null;
  patientSuggestions.innerHTML = "";
  if (!query) return;

  timeout = setTimeout(() => {
    const matches = patients.filter(p =>
      p.patientId.toLowerCase().includes(query) ||
      `${p.firstName} ${p.lastName}`.toLowerCase().includes(query)
    );

    matches.forEach(p => {
      const div = document.createElement("div");
      div.className = "list-group-item list-group-item-action";
      div.textContent = `${p.firstName} ${p.lastName} (${p.patientId})`;
      div.addEventListener("click", () => {
        patientInput.value = `${p.firstName} ${p.lastName} (${p.patientId})`;
        selectedPatient = p;
        patientSuggestions.innerHTML = "";
        loadPreviousPrescriptions(selectedPatient.patientId);
      });
      patientSuggestions.appendChild(div);
    });
  }, 200);
});

document.addEventListener("click", e => {
  if (!patientInput.contains(e.target) && !patientSuggestions.contains(e.target)) {
    patientSuggestions.innerHTML = "";
  }
});

// Add medicine row
function addMedicine() {
  const row = document.createElement("div");
  row.classList.add("medicine-row");
  row.innerHTML = `
    <input type="text" class="form-control med-name" placeholder="Medicine Name" required>
    <input type="text" class="form-control med-dose" placeholder="Dosage (500mg)" required>
    <input type="text" class="form-control med-freq" placeholder="Frequency (2/day)" required>
    <input type="text" class="form-control med-duration" placeholder="Duration (5 days)" required>
  `;
  medicinesContainer.appendChild(row);
}

// Submit prescription
prescriptionForm.addEventListener("submit", async e => {
  e.preventDefault();
  if (!selectedPatient) return alert("Please select a patient");

  const medicines = [];
  document.querySelectorAll(".medicine-row").forEach(row => {
    medicines.push({
      name: row.querySelector(".med-name").value,
      dose: row.querySelector(".med-dose").value,
      freq: row.querySelector(".med-freq").value,
      duration: row.querySelector(".med-duration").value
    });
  });

  const prescription = {
    visitDate: document.getElementById("date").value,
    medicines: medicines,
    notes: document.getElementById("notes").value
  };

  try {
    await fetch(`${API_BASE}/prescriptions?patientCode=${selectedPatient.patientId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(prescription)
    });
    alert("Prescription saved successfully!");
    prescriptionForm.reset();
    medicinesContainer.innerHTML = `
      <div class="medicine-row">
        <input type="text" class="form-control med-name" placeholder="Medicine Name" required>
        <input type="text" class="form-control med-dose" placeholder="Dosage (500mg)" required>
        <input type="text" class="form-control med-freq" placeholder="Frequency (2/day)" required>
        <input type="text" class="form-control med-duration" placeholder="Duration (5 days)" required>
      </div>`;
    loadPreviousPrescriptions(selectedPatient.patientId);
  } catch (err) {
    console.error(err);
    alert("Failed to save prescription");
  }
});

// Load previous prescriptions
async function loadPreviousPrescriptions(patientId) {
  prescriptionTable.innerHTML = "";
  try {
    const res = await fetch(`${API_BASE}/prescriptions/${patientId}`);
    const prescriptions = await res.json();
    if (prescriptions.length === 0) {
      prescriptionTable.innerHTML = `<tr><td colspan="4" class="text-center">No prescriptions found</td></tr>`;
      return;
    }

    prescriptions.forEach((p, i) => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${i + 1}</td>
        <td>${p.patient.firstName} ${p.patient.lastName}</td>
        <td>${p.visitDate}</td>
        <td><button class="btn btn-sm btn-success" onclick='downloadPDF(${JSON.stringify(p)})'>📄 PDF</button></td>
      `;
      prescriptionTable.appendChild(row);
    });
  } catch (err) {
    console.error(err);
  }
}

// Download PDF
function downloadPDF(p) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(18);
  doc.text("Prescription", 10, 15);
  doc.setFontSize(12);
  doc.text(`Patient: ${p.patient.firstName} ${p.patient.lastName}`, 10, 30);
  doc.text(`Date: ${p.visitDate}`, 10, 40);

  let y = 50;
  doc.text("Medicines:", 10, y);
  y += 10;
  p.medicines.forEach(m => {
    doc.text(`- ${m.name}, ${m.dose}, ${m.freq}, ${m.duration}`, 12, y);
    y += 8;
  });

  if (p.notes) {
    y += 5;
    doc.text("Notes:", 10, y);
    y += 10;
    doc.text(p.notes, 12, y);
  }

  doc.save(`Prescription_${p.patient.firstName}_${p.patient.lastName}_${p.visitDate}.pdf`);
}

// Initialize
document.getElementById("date").value = new Date().toISOString().split("T")[0];
</script>

</body>
</html>
