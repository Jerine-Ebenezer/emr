<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lab Reports</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>

    /* Labels - softer look */
    .form-label { font-weight: 500; color: #333; }

    /* Inputs, textarea - clean card style */
    .form-control, textarea {
      background-color: #fff !important;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      transition: all 0.2s ease-in-out;
    }

    .form-control:focus, textarea:focus {
      border-color: #007bff;
      box-shadow: 0 0 6px rgba(0,123,255,0.4);
    }

    /* Buttons */
    .btn { border-radius: 8px; padding: 8px 18px; }

    /* Placeholder */
    ::placeholder { color: #999; font-style: italic; }

    body {
      background: linear-gradient(90deg, #007bff, #00c6ff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .card { border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); margin-bottom: 30px; }
    h2 { font-weight: 700; color: #007bff; }
    footer { margin-top: 40px; text-align: center; font-size: 0.9rem; color: #888; }

    /* Suggestions box */
    #patientSuggestions {
      position: absolute;
      z-index: 1000;
      width: 100%;
      max-height: 200px;
      overflow-y: auto;
    }
    #patientSuggestions .list-group-item { cursor: pointer; }
    
  </style>
</head>
<body>
 <div class="mb-3">
  <a href="dashboard.html" class="btn btn-primary">&larr; Back to Dashboard</a>
</div>
<div class="container mt-5">
  <div class="card p-4">
    <h2 class="mb-4">Lab Reports</h2>
    <form id="labForm">
      <!-- Patient autocomplete -->
      <div class="mb-3 position-relative">
        <label class="form-label">Select Patient</label>
        <input type="text" id="patientInput" class="form-control" placeholder="Type patient name or ID" required>
        <div id="patientSuggestions" class="list-group mt-1"></div>
      </div>

      <!-- Test Name -->
      <div class="mb-3">
        <label class="form-label">Test Name</label>
        <input type="text" id="testName" class="form-control" placeholder="CBC, Blood Sugar, MRI, etc." required>
      </div>

      <!-- Lab Name -->
      <div class="mb-3">
        <label class="form-label">Lab Name</label>
        <input type="text" id="labName" class="form-control" placeholder="Lab or Hospital Name">
      </div>

      <!-- Result -->
      <div class="mb-3">
        <label class="form-label">Result</label>
        <textarea id="result" class="form-control" rows="2" placeholder="Numeric value or description" required></textarea>
      </div>

      <!-- Reference Range -->
      <div class="mb-3">
        <label class="form-label">Reference Range</label>
        <input type="text" id="refRange" class="form-control" placeholder="e.g., 12-16 g/dL, 70-110 mg/dL">
      </div>

      <!-- Units -->
      <div class="mb-3">
        <label class="form-label">Units</label>
        <input type="text" id="units" class="form-control" placeholder="mg/dL, g/dL, mmol/L, etc.">
      </div>

      <!-- Buttons -->
      <div class="d-flex justify-content-between">
        <button type="reset" class="btn btn-outline-secondary">Clear</button>
        <button type="submit" class="btn btn-primary">Save Report</button>
      </div>
    </form>
  </div>

  <footer>
    <p class="text-center mt-4 mb-4 text-muted">EMR System © 2025</p>
  </footer>
</div>

<script>


//const API_BASE = "http://localhost:8080/api";
const API_BASE = "https://emr-backend-ni58.onrender.com/api";
const labForm = document.getElementById("labForm");
const patientInput = document.getElementById("patientInput");
const patientSuggestions = document.getElementById("patientSuggestions");

// Load patients from backend
let patients = [];
let selectedPatientId = null;

async function loadPatients() {
  try {
    const res = await fetch(`${API_BASE}/patients`);
    if (!res.ok) throw new Error("Failed to fetch patients");
    patients = await res.json();
  } catch(err) {
    console.error(err);
    alert("Could not load patients from server");
  }
}
loadPatients();

// Autocomplete logic
let timeout;
patientInput.addEventListener("input", () => {
  clearTimeout(timeout);
  const query = patientInput.value.trim().toLowerCase();
  selectedPatientId = null;

  if (!query) {
    patientSuggestions.innerHTML = "";
    return;
  }

  timeout = setTimeout(() => {
    const filtered = patients.filter(p =>
      `${p.firstName} ${p.lastName}`.toLowerCase().includes(query) ||
      p.patientId.toLowerCase().includes(query)
    );

    patientSuggestions.innerHTML = "";
    filtered.forEach(p => {
      const div = document.createElement("div");
      div.className = "list-group-item list-group-item-action";
      div.textContent = `${p.firstName} ${p.lastName} (${p.patientId})`;
      div.addEventListener("click", () => {
        patientInput.value = `${p.firstName} ${p.lastName} (${p.patientId})`;
        selectedPatientId = p.patientId;
        patientSuggestions.innerHTML = "";
      });
      patientSuggestions.appendChild(div);
    });
  }, 200);
});

document.addEventListener("click", e => {
  if (!patientInput.contains(e.target) && !patientSuggestions.contains(e.target)) {
    patientSuggestions.innerHTML = "";
  }
});

// Form submission - save to backend
labForm.addEventListener("submit", async function(e) {
  e.preventDefault();

  if (!selectedPatientId) return alert("Please select a valid patient.");

  const report = {
    testName: document.getElementById("testName").value,
    labName: document.getElementById("labName").value,
    result: document.getElementById("result").value,
    referenceRange: document.getElementById("refRange").value,
    units: document.getElementById("units").value
  };

  try {
    const res = await fetch(`${API_BASE}/lab-reports?patientCode=${selectedPatientId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(report)
    });

    if (!res.ok) throw new Error("Failed to save report");

    alert("Lab report saved successfully!");
    labForm.reset();
    selectedPatientId = null;
  } catch(err) {
    console.error(err);
    alert("Error saving report. See console for details.");
  }
});


</script>

</body>
</html>
