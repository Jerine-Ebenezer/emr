<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Records</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      background: linear-gradient(90deg, #007bff, #00c6ff); 
      font-family: Segoe UI, Tahoma, Geneva, Verdana, sans-serif; 
      min-height: 100vh;
    }
    .section-card { 
      border-radius: 15px; 
      background: #fff; 
      box-shadow: 0 5px 15px rgba(0,0,0,0.08); 
      margin-bottom: 30px; 
      padding: 24px; 
    }
    h2 { color: white; margin-top: 24px; }
    table { background: #fff; }

    /* Search input */
    #abhaSearch {
      border-radius: 25px 0 0 25px;
      border: 1px solid #ddd;
      padding: 12px 16px;
      font-size: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease-in-out;
    }
    #abhaSearch:focus { border-color: #007bff; box-shadow: 0 0 8px rgba(0,123,255,0.4); outline: none; }
    .input-group .btn-success { border-radius: 0 25px 25px 0; padding: 12px 20px; background: #28a745; border: none; }
    .input-group .btn-success:hover { background: #218838; transform: scale(1.05); }

    /* Autocomplete dropdown */
    #suggestions {
      position: absolute;
      z-index: 1000;
      width: 100%;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    #suggestions div { padding: 8px; cursor: pointer; }
    #suggestions div:hover { background: #f1f1f1; }
  </style>
</head>
<body>
  <div class="mb-3">
    <a href="dashboard.html" class="btn btn-primary">&larr; Back to Dashboard</a>
  </div>

  <div class="container my-5">
    <h2>Consolidated Patient Record</h2>

    <!-- Search -->
    <div class="mb-4 position-relative">
      <label for="abhaSearch" class="form-label" style="color: #f1f1f1;">Search by ABHA ID / Name</label>
      <div class="input-group">
        <input type="text" id="abhaSearch" class="form-control" placeholder="Enter P001 or Name">
        <button class="btn btn-success" onclick="searchByPatient()">Search</button>
      </div>
      <div id="suggestions"></div>
    </div>

    <div id="allRecords"></div>
  </div>

  <script>
    //const API_BASE = "http://localhost:8080";
    const API_BASE = "https://emr-backend-ni58.onrender.com";
    const abhaSearch = document.getElementById('abhaSearch');
    const suggestions = document.getElementById('suggestions');

    let patients = [];

    // Load all patients from backend on page load
    async function loadPatients() {
      try {
        const res = await fetch(`${API_BASE}/api/patients`);
        if (!res.ok) throw new Error("Failed to fetch patients");
        patients = await res.json();
      } catch(err) {
        console.error(err);
        alert("Could not load patients from server");
      }
    }
    loadPatients();

    // Autocomplete suggestions
    abhaSearch.addEventListener('input', function() {
      const query = this.value.trim().toLowerCase();
      suggestions.innerHTML = '';
      if (!query) { suggestions.style.display = 'none'; return; }

      const matches = patients.filter(p =>
        (p.patientId && p.patientId.toLowerCase().includes(query)) ||
        (`${p.firstName} ${p.lastName}`.toLowerCase().includes(query))
      );

      if (matches.length) {
        suggestions.style.display = 'block';
        matches.forEach(p => {
          const div = document.createElement('div');
          div.textContent = `${p.patientId} - ${p.firstName} ${p.lastName}`;
          div.onclick = () => {
            abhaSearch.value = p.patientId;
            suggestions.style.display = 'none';
            searchByPatient();
          };
          suggestions.appendChild(div);
        });
      } else {
        suggestions.style.display = 'none';
      }
    });

    // Hide suggestions when clicking outside
    document.addEventListener('click', e => {
      if (!e.target.closest('#abhaSearch') && !e.target.closest('#suggestions')) {
        suggestions.style.display = 'none';
      }
    });

    // Fetch medical history from backend
    async function getMedicalHistory(patientCode) {
      try {
        const res = await fetch(`${API_BASE}/api/med-history/${encodeURIComponent(patientCode)}`);
        if (!res.ok) {
          if (res.status === 404) return null;
          throw new Error("Failed to fetch medical history");
        }
        return await res.json();
      } catch(err) {
        console.error(err);
        return null;
      }
    }
    // Fetch clinical report from backend
  async function getClinicalReport(patientCode) {
  try {
    const res = await fetch(`${API_BASE}/api/clinical-reports/${encodeURIComponent(patientCode)}`);
    if (!res.ok) {
      if (res.status === 404) return [];
      throw new Error("Failed to fetch clinical reports");
    }
    return await res.json(); // this will be a list of reports
  } catch(err) {
    console.error(err);
    return [];
  }
}
async function getLabReport(patientCode) {
  try {
    const res = await fetch(`${API_BASE}/api/lab-reports/${encodeURIComponent(patientCode)}`);
    if (!res.ok) {
      if (res.status === 404) return [];
      throw new Error("Failed to fetch Lab reports");
    }
    const data = await res.json();
    return Array.isArray(data) ? data : [data]; // ensures it's always an array
  } catch(err) {
    console.error(err);
    return [];
  }
}

// Fetch prescriptions from backend
async function getPrescriptions(patientCode) {
  try {
    const res = await fetch(`${API_BASE}/api/prescriptions/${encodeURIComponent(patientCode)}`);
    if (!res.ok) {
      if (res.status === 404) return [];
      throw new Error("Failed to fetch prescriptions");
    }
    return await res.json(); // list of prescriptions
  } catch(err) {
    console.error(err);
    return [];
  }
}

    // Search by patient code or name
    async function searchByPatient() {
      const query = abhaSearch.value.trim();
      if (!query) { alert("Enter patient code or name"); return; }

      // Find patient from backend-loaded list
      const patient = patients.find(p =>
        p.patientId.toLowerCase() === query.toLowerCase() ||
        (`${p.firstName} ${p.lastName}`).toLowerCase().includes(query.toLowerCase())
      );

      if (!patient) {
        document.getElementById('allRecords').innerHTML = `<div class="alert alert-danger">No patient found for: ${query}</div>`;
        return;
      }

      const history = await getMedicalHistory(patient.patientId);
      const report = await getClinicalReport(patient.patientId);
      const lab = await getLabReport(patient.patientId);
      const prescription = await getPrescriptions(patient.patientId);
      showAllRecords(patient,history,report,lab,prescription);
    }

    // Show patient + medical history + other sections
    function showAllRecords(patient, history,report,lab,prescription) {
      let html = `<div class="section-card">
        <h4>Demographics</h4>
        <table class="table table-bordered">
          <tr><th>Name</th><td>${patient.firstName} ${patient.lastName}</td></tr>
          <tr><th>DOB</th><td>${patient.dob}</td></tr>
          <tr><th>Gender</th><td>${patient.gender}</td></tr>
          <tr><th>Phone</th><td>${patient.phoneNumber}</td></tr>
          <tr><th>Email</th><td>${patient.email}</td></tr>
          <tr><th>Address</th><td>${patient.address}</td></tr>
          <tr><th>ABHA ID</th><td>${patient.abhaId}</td></tr>
        </table>
      </div>`;

      if (history) {
        html += `<div class="section-card"><h4>Medical History</h4><ul>
          <li><b>Past Illnesses:</b> ${history.pastIllnesses || '-'}</li>
          <li><b>Surgeries:</b> ${history.surgeries || '-'}</li>
          <li><b>Allergies:</b> ${history.allergies || '-'}</li>
          <li><b>Family History:</b> ${history.familyHistory || '-'}</li>
          <li><b>Social History:</b> ${history.socialHistory || '-'}</li>
          <li><b>Immunizations:</b> ${history.immunizations || '-'}</li>
        </ul></div>`;
      }
     if (report && report.length) {
  html += `<div class="section-card"><h4>Clinical Reports</h4>`;
  report.forEach(r => {
    html += `<ul>
      <li><b>Visit Date:</b> ${r.visitDate || '-'}</li>
      <li><b>Diagnosis:</b> ${r.diagnosis || '-'}</li>
      <li><b>ICD code:</b> ${r.icdCode || '-'}</li>
      <li><b>Notes:</b> ${r.notes || '-'}</li>
      <li><b>Treatment:</b> ${r.treatment || '-'}</li>
    </ul><hr>`;
  });
  html += `</div>`;
}
 if (lab && lab.length) {
  html += `<div class="section-card"><h4>Lab Reports</h4>`;
  lab.forEach(l => {
    html += `<ul>
      <li><b>Lab Name:</b> ${l.labName || '-'}</li>
      <li><b>Test Name:</b> ${l.testName || '-'}</li>
      <li><b>Results:</b> ${l.result || '-'}</li>
      <li><b>Reference Range:</b> ${l.referenceRange || '-'}</li>
      <li><b>Units:</b> ${l.units || '-'}</li>
    </ul><hr>`;
  });
  html += `</div>`;
}
if (prescription.length) {
  html += `<div class="section-card"><h4>Prescriptions</h4>
    <table class="table table-striped">
      <thead>
        <tr><th>Date</th><th>Medicines</th><th>Notes</th></tr>
      </thead>
      <tbody>
        ${prescription.map(pr => `<tr>
          <td>${pr.visitDate || '-'}</td>
          <td>
            <ul>
            ${pr.medicines.map(m => `<li>${m.name || '-'} (${m.dose || '-'}, ${m.freq || '-'}, ${m.duration || '-'})</li>`).join('')}
            </ul>
          </td>
          <td>${pr.notes || '-'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

      // Other sections from localStorage
      const patientId = patient.patientId;

      document.getElementById('allRecords').innerHTML = html;
    }
  </script>
</body>
</html>
