<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Registration - EMR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #00bfa6, #6c63ff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      height: 100vh;
    }
    .register-card {
      border-radius: 15px;
      padding: 2rem;
      width: 550px;
      max-width: 90%;
      background: #ffffffcc;
      backdrop-filter: blur(10px);
    }
    h3 {
      color: #333;
      font-weight: 600;
    }
    .btn-register {
      background-color: #28a745;
      color: white;
    }
    .btn-register:hover {
      background-color: #1e7e34;
    }
    .small-link {
      font-size: 0.9rem;
    }
  </style>

</head>

<body class="d-flex justify-content-center align-items-center">

  <div class="register-card shadow-lg">

    <h3 class="text-center mb-3">Doctor Registration</h3>
    <p class="text-muted text-center small mb-4">
      Create your doctor account to access EMR
    </p>

    <form id="registerForm" autocomplete="off">

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter full name" required>
        </div>

        <div class="col-md-6 mb-3">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Choose a username" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="Enter email address" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Phone</label>
        <input type="text" id="phone" class="form-control" placeholder="Enter phone number" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Specialization</label>
        <input type="text" id="specialization" class="form-control" placeholder="e.g., Cardiologist, Dermatologist" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Create password" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password" required>
      </div>

      <div class="d-grid gap-2 mt-3">
        <button type="submit" class="btn btn-register">Register</button>
        <a href="login.html" class="text-center small-link">Already have an account? Login</a>
      </div>

    </form>

  </div>

 <script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const name = document.getElementById('name').value.trim();
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const specialization = document.getElementById('specialization').value.trim();
  const password = document.getElementById('password').value.trim();
  const confirmPassword = document.getElementById('confirmPassword').value.trim();

  if (!name || !username || !email || !phone || !specialization || !password) {
    alert("Please fill all fields");
    return;
  }

  if (password !== confirmPassword) {
    alert("Passwords do not match!");
    return;
  }

  // Send data to backend
  try {
    const response = await fetch('http://localhost:8080/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        fullName: name,
        username: username,
        email: email,
        phone: phone,
        specialization: specialization,
        password: password
      })
    });

    const data = await response.text(); // backend returns plain string
    alert(data);

    if (response.ok) {
      window.location.href = "login.html";
    }

  } catch (error) {
    console.error(error);
    alert("Something went wrong!");
  }
});
</script>

    

</body>
</html>
